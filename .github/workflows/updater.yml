name: dump protobufs on version change

on:
  schedule:
    - cron: '1,31 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: install deps
        run: >
          python -m pip install --upgrade pip
          justapk==0.1.1 requests capstone==5.0.7 pyelftools==0.31 protobuf==3.20.3

      - name: run updater
        run: python updater.py

      - name: commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --staged --quiet || (git commit -m 'update protobufs' && git push)
