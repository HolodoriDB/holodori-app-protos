syntax = "proto3";

import "entity/master/options/master.proto";
import "entity/transaction/options/transaction.proto";

package entity.transaction;

option go_package = "github.com/qua-vision/vision-server/pkg/pb/transaction";
option csharp_namespace = "Vision.Common.Proto.Transaction";

message UserCharacterSkillTreePreset {
	string character_id = 2 [(options.master.fk) = "Character:id", (options.transaction.pk) = true];
	int32 number = 3 [(options.transaction.pk) = true];
	string name = 4;
	string user_memo = 5;
	repeated string released_skill_tree_node_group_ids = 6;
	repeated string connected_skill_tree_node_group_ids = 7;
	repeated string connected_skill_tree_node_card_ids = 8 [(options.master.fk) = "Card:id"];
	int64 last_saved_time = 9;
}
