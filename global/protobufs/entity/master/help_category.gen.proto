syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";
import "enums/help_category_screen_type.gen.proto";
import "enums/help_category_type.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message HelpCategory {
  string id = 1;
  enums.HelpCategoryType type = 2;
  string title_lang_id = 3;
  enums.HelpCategoryScreenType screen_type = 4;
