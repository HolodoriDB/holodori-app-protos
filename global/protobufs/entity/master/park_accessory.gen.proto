syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message ParkAccessory {
  string id = 1;
  string character_id = 2;
  string name_lang_id = 3;
  string asset_id = 4;
  string thumbnail_asset_id = 5;
  string park_character_shop_thumbnail_asset_id = 6;
  repeated string reward_park_emotion_ids = 7;
  int32 order = 999;
}
