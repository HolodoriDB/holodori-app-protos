syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";
import "enums/park_script_parameter_type.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message ParkGraph {
  string id = 1;
  string graph_id = 2;
  repeated string parameter_values = 3;
  repeated enums.ParkScriptParameterType parameter_types = 4;
}
