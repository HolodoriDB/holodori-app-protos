syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";
import "enums/park_quest_type.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message ParkQuest {
  string id = 1;
  string park_quest_chapter_id = 2;
  int32 number = 3;
  string title_lang_id = 4;
  string description_lang_id = 5;
  enums.ParkQuestType type = 6;
  string play_character_id = 7;
  int32 priority = 8;
  string area_grouping_id = 9;
  int32 ratio = 10;
  string view_condition_group_id = 11;
  string unlock_condition_group_id = 12;
  string park_target_mapping_id = 13;
  int32 order = 999;
}
