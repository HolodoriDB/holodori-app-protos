syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message CharacterStory {
  string character_id = 1;
  int32 number = 2;
  string title_lang_id = 3;
  string story_id = 4;
  string archive_view_condition_group_id = 5;
  string unlock_condition_group_id = 6;
  string asset_id = 7;
}
