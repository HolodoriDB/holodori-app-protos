syntax = "proto3";

import "entity/master/options/master.proto";
import "enums/shogi_voice_timing_type.gen.proto";
import "enums/shogi_wipe_type.gen.proto";

package entity.master;

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message ShogiCharacterVoice {
	option (options.master.table) = true;

	string character_id = 1 [(options.master.fk) = "Character:id", (options.master.pk) = true];
	.enums.ShogiVoiceTimingType timing_type = 2 [(options.master.pk) = true];
	.enums.ShogiWipeType wipe_type = 3 [(options.master.pk) = true];
	int32 number = 4 [(options.master.pk) = true];
	string character_voice_id = 5 [(options.master.fk) = "CharacterVoice:id", (options.master.optional) = true];
	string text_lang_id = 6 [(options.master.fk) = "LangShogiCharacterVoice:id", (options.master.optional) = true];
	bool is_wipe_display = 7 [(options.master.optional) = true];
}
