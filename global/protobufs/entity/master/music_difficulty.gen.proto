syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";
import "enums/music_difficulty_type.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message MusicDifficulty {
  string music_id = 1;
  enums.MusicDifficultyType difficulty_type = 2;
  int32 difficulty_level = 3;
  string chart_asset_id = 4;
  string view_condition_group_id = 5;
  string unlock_condition_group_id = 6;
}
