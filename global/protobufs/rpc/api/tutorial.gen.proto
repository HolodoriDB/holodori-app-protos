syntax = "proto3";

package rpc.api;

import "buf/validate/validate.proto";
import "entity/master/options/master.proto";
import "enums/tutorial_type.gen.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "options/check_option.proto";
import "rpc/api/common/response.gen.proto";
import "rpc/api/common/reward.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/rpc/api";
option csharp_namespace = "Vision.Common.Proto.Api";

message TutorialProgressRequest {
  enums.TutorialType tutorial_type = 1;
  int32 progress = 2;
}

message TutorialRegisterCountryRequest {
  string country_code = 1;
}

message TutorialRegisterBirthdayRequest {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message TutorialSetNameRequest {
  string name = 1;
}

message TutorialRegisterInitialUserInfoRequest {
  string country_code = 1;
  int32 birth_year = 2;
  int32 birth_month = 3;
  string user_name = 4;
}

message TutorialChooseCharacterRequest {
  string character_id = 1;
}

message TutorialChooseCharacterResponse {
  repeated common.RewardResult reward_results = 1;
  common.Response common_response = 9999;
}

message TutorialDrawGachaResponse {
  repeated string card_ids = 1;
  string gacha_animation_grouping_id = 2;
  common.Response common_response = 9999;
}

message TutorialConfirmGachaResponse {
  repeated common.RewardResult card_reward_results = 1;
  common.Response common_response = 9999;
}

message TutorialListGachaCardResponse {
  repeated string card_ids = 1;
  common.Response common_response = 9999;
}

message TutorialReadInstantTipsRequest {
  string instant_tips_id = 1;
}

message TutorialProgressResponse {
  common.Response common_response = 9999;
}

message TutorialRegisterInitialUserInfoResponse {
  common.Response common_response = 9999;
}

message TutorialReadInstantTipsResponse {
  common.Response common_response = 9999;
}

service Tutorial {
  rpc Progress (TutorialProgressRequest) returns (TutorialProgressResponse);
  rpc RegisterInitialUserInfo (TutorialRegisterInitialUserInfoRequest) returns (TutorialRegisterInitialUserInfoResponse);
  rpc ChooseCharacter (TutorialChooseCharacterRequest) returns (TutorialChooseCharacterResponse);
  rpc DrawGacha (google.protobuf.Empty) returns (TutorialDrawGachaResponse);
  rpc ConfirmGacha (google.protobuf.Empty) returns (TutorialConfirmGachaResponse);
  rpc ListGachaCard (google.protobuf.Empty) returns (TutorialListGachaCardResponse);
  rpc ReadInstantTips (TutorialReadInstantTipsRequest) returns (TutorialReadInstantTipsResponse);
}
