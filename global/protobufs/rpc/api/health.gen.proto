syntax = "proto3";

package rpc.api;

import "enums/health_check_serving_status.gen.proto";
import "google/api/annotations.proto";
import "options/check_option.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/rpc/api";
option csharp_namespace = "Vision.Common.Proto.Api";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enums.HealthCheckServingStatus status = 1;
}

service Health {
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
}
