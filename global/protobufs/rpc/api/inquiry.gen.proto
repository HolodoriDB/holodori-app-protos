syntax = "proto3";

package rpc.api;

import "buf/validate/validate.proto";
import "enums/graphics_quality_type.gen.proto";
import "google/api/annotations.proto";
import "options/check_option.proto";
import "options/zap.proto";
import "rpc/api/common/response.gen.proto";
import "rpc/api/common/storage_url.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/rpc/api";
option csharp_namespace = "Vision.Common.Proto.Api";

message InquirySendRequest {
  string public_user_id = 1;
  string mail_address = 2;
  string app_version = 3;
  string os_version = 4;
  string device_name = 5;
  string inquiry_content = 6;
  string device_log_upload_url = 7;
  string device_purchase_log_upload_url = 8;
  int32 frame_rate = 9;
  int32 live_frame_rate = 10;
  enums.GraphicsQualityType basic_graphics_quality_type = 11;
  string inquiry_category = 12;
}

message InquiryGetUploadUrlRequest {
  string public_user_id = 1;
}

message InquiryGetUploadUrlResponse {
  common.StorageUrlInfo device_log_upload_storage_url_info = 1;
  common.StorageUrlInfo device_purchase_log_upload_storage_url_info = 2;
  common.Response common_response = 9999;
}

message InquirySendResponse {
  common.Response common_response = 9999;
}

service Inquiry {
  rpc Send (InquirySendRequest) returns (InquirySendResponse);
  rpc GetUploadUrl (InquiryGetUploadUrlRequest) returns (InquiryGetUploadUrlResponse);
}
