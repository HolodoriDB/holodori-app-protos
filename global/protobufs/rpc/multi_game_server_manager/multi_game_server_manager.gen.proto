syntax = "proto3";

import "buf/validate/validate.proto";
import "enums/cheat_severity_type.gen.proto";
import "enums/cheat_type.gen.proto";
import "enums/health_check_serving_status.gen.proto";
import "enums/multi_game_type.gen.proto";
import "google/protobuf/empty.proto";
import "options/check_option.proto";

package rpc.multi_game_server_manager;

option go_package = "github.com/qua-vision/vision-server/pkg/pb/rpc/multi_game_server_manager";
option csharp_namespace = "Vision.Common.Proto.MultiGameServerManager";

message CheckHealthResponse {
	.enums.HealthCheckServingStatus status = 1;
}

message ReadyGameServerRequest {
	string unity_dgs_log_file_name = 1;
	string play_log_file_name = 2;
}

message StartGameResponse {
	string result_id = 1;
}

message SaveGameResultRequest {
	.enums.MultiGameType multi_game_type = 1;
	bytes result_data = 2 [(buf.validate.field).bytes.min_len = 1];
	int64 saved_time = 3;
}

message ChangePrivateRoomHostUserRequest {
	string changed_host_public_user_id = 1 [(buf.validate.field).string.min_bytes = 1];
}

message PublishPrivateRoomRequest {
	string host_public_user_id = 1 [(buf.validate.field).string.min_bytes = 1];
}

message IsRandomMatchPublishedResponse {
	bool is_random_match_published = 1;
}

message ConnectUserRequest {
	string token = 1 [(buf.validate.field).string.min_bytes = 1];
}

message ConnectUserResponse {
	string public_user_id = 1;
	bool is_private_room_host_user = 2;
	bool is_private_room = 3;
	int32 max_user_count = 4;
	int32 total_member_count = 5;
}

message DisconnectUserRequest {
	message CheatDetectInfo {
		message CircuitPerAreaPassInfo {
			message PerAreaPassInfo {
				int64 area_pass_millisecond = 1;
				int64 dash_count = 2;
			}

			repeated DisconnectUserRequest.CheatDetectInfo.CircuitPerAreaPassInfo.PerAreaPassInfo per_area_pass_infos = 1;
		}

		message ChasePerElapsedTimeInfo {
			message AbnormalMoveSpeedInfo {
				float max_move_speed = 1;
				int64 duration_milliseconds = 2;
			}

			message ProhibitedAreaStayInfo {
				float position_x = 1;
				float position_y = 2;
				float position_z = 3;
				int64 duration_milliseconds = 4;
			}

			repeated DisconnectUserRequest.CheatDetectInfo.ChasePerElapsedTimeInfo.AbnormalMoveSpeedInfo abnormal_move_speed_infos = 1;
			repeated DisconnectUserRequest.CheatDetectInfo.ChasePerElapsedTimeInfo.ProhibitedAreaStayInfo prohibited_area_stay_infos = 2;
		}

		message SplashBallMismatchInfo {
			message PositionMismatchInfo {
				float client_ball_position_x = 1;
				float client_ball_position_y = 2;
				float client_ball_position_z = 3;
				float dgs_ball_position_x = 4;
				float dgs_ball_position_y = 5;
				float dgs_ball_position_z = 6;
				float client_player_position_x = 7;
				float client_player_position_y = 8;
				float client_player_position_z = 9;
				float dgs_player_position_x = 10;
				float dgs_player_position_y = 11;
				float dgs_player_position_z = 12;
			}

			int64 position_mismatch_count = 1;
			repeated DisconnectUserRequest.CheatDetectInfo.SplashBallMismatchInfo.PositionMismatchInfo position_mismatch_infos = 2;
			int64 abnormal_move_speed_count = 3;
			repeated float abnormal_move_speeds = 4;
		}

		.enums.CheatType cheat_type = 1;
		.enums.CheatSeverityType severity_type = 2;
		DisconnectUserRequest.CheatDetectInfo.CircuitPerAreaPassInfo circuit_per_area_pass_info = 100;
		DisconnectUserRequest.CheatDetectInfo.ChasePerElapsedTimeInfo chase_per_elapsed_time_info = 101;
		DisconnectUserRequest.CheatDetectInfo.SplashBallMismatchInfo splash_ball_mismatch_info = 102;
	}

	string public_user_id = 1 [(buf.validate.field).string.min_bytes = 1];
	bool is_penalty_disconnection = 2;
	bool is_force_exit = 3;
	DisconnectUserRequest.CheatDetectInfo cheat_detect_info = 4;
}

message GetTlsCertificateResponse {
	string tls_server_cert = 1;
	string tls_server_private_key = 2;
}

message MigrateGameServerRequest {
	bytes game_data = 1;
}

message MigrateGameServerResponse {
	message AuthInfo {
		string public_user_id = 1;
		string token = 2;
	}

	string ip = 1;
	uint32 port = 2;
	repeated MigrateGameServerResponse.AuthInfo auth_infos = 3;
}

message GetSuspendedGameDataResponse {
	bytes game_data = 1;
}

service MultiGameServerManager {
	rpc CheckHealth (.google.protobuf.Empty) returns (.rpc.multi_game_server_manager.CheckHealthResponse);
	rpc ReadyGameServer (.rpc.multi_game_server_manager.ReadyGameServerRequest) returns (.google.protobuf.Empty);
	rpc ResetGameServer (.google.protobuf.Empty) returns (.google.protobuf.Empty);
	rpc ShutdownGameServer (.google.protobuf.Empty) returns (.google.protobuf.Empty);
	rpc ChangePrivateRoomHostUser (.rpc.multi_game_server_manager.ChangePrivateRoomHostUserRequest) returns (.google.protobuf.Empty);
	rpc PublishPrivateRoom (.rpc.multi_game_server_manager.PublishPrivateRoomRequest) returns (.google.protobuf.Empty);
	rpc IsRandomMatchPublished (.google.protobuf.Empty) returns (.rpc.multi_game_server_manager.IsRandomMatchPublishedResponse);
	rpc StopMatching (.google.protobuf.Empty) returns (.google.protobuf.Empty);
	rpc StartGame (.google.protobuf.Empty) returns (.rpc.multi_game_server_manager.StartGameResponse);
	rpc SaveGameResult (.rpc.multi_game_server_manager.SaveGameResultRequest) returns (.google.protobuf.Empty);

	rpc ConnectUser (.rpc.multi_game_server_manager.ConnectUserRequest) returns (.rpc.multi_game_server_manager.ConnectUserResponse) {
		option (options.check_option.error).error_codes = ERROR_CODE_UNAUTHENTICATED;
		option (options.check_option.error).error_codes = ERROR_CODE_MULTI_GAME_USER_ALREADY_CONNECTED;
		option (options.check_option.error).error_codes = ERROR_CODE_MULTI_GAME_NON_MATCHED_USER;
	}

	rpc DisconnectUser (.rpc.multi_game_server_manager.DisconnectUserRequest) returns (.google.protobuf.Empty) {
		option (options.check_option.error).error_codes = ERROR_CODE_MULTI_GAME_USER_NOT_CONNECTED;
	}

	rpc GetTlsCertificate (.google.protobuf.Empty) returns (.rpc.multi_game_server_manager.GetTlsCertificateResponse);
	rpc MigrateGameServer (.rpc.multi_game_server_manager.MigrateGameServerRequest) returns (.rpc.multi_game_server_manager.MigrateGameServerResponse);
	rpc GetSuspendedGameData (.google.protobuf.Empty) returns (.rpc.multi_game_server_manager.GetSuspendedGameDataResponse);
}
