syntax = "proto3";

import "buf/validate/validate.proto";
import "dto/multi_game_result/common.gen.proto";
import "enums/shogi_piece_type.gen.proto";
import "enums/shogi_result_type.gen.proto";
import "options/multi_game_result.proto";

package dto.multi_game_result;

option go_package = "github.com/qua-vision/vision-server/pkg/pb/dto/multi_game_result";
option csharp_namespace = "Vision.Common.Proto.Dto.MultiGameResult";

message MiniGameShogiResult {
	option (options.multi_game_result.message).multi_game_type = MULTI_GAME_TYPE_MINI_GAME_SHOGI;

	message UserResult {
		message PieceResult {
			.enums.ShogiPieceType piece_type = 1 [(buf.validate.field).enum.defined_only = true, (buf.validate.field).enum.not_in = 0];
			int64 take_count = 2 [(buf.validate.field).int64.gte = 0];
			int64 taken_count = 3 [(buf.validate.field).int64.gte = 0];
		}

		.enums.ShogiResultType result_type = 1 [(buf.validate.field).enum.defined_only = true, (buf.validate.field).enum.not_in = 0];
		repeated MiniGameShogiResult.UserResult.PieceResult piece_results = 2 [(buf.validate.field).repeated.max_items = 5];
		int32 invalid_request_count = 3 [(buf.validate.field).int32.gte = 0];
		MultiGameCommonUserResult common_user_result = 100 [(buf.validate.field).required = true];
	}

	repeated MiniGameShogiResult.UserResult user_results = 1 [(buf.validate.field).repeated.min_items = 2, (buf.validate.field).repeated.max_items = 2];
}
