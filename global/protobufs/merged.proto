				TYPE_INT64 = 3;
				TYPE_UINT64 = 4;
				TYPE_INT32 = 5;
				TYPE_FIXED64 = 6;
				TYPE_FIXED32 = 7;
				TYPE_BOOL = 8;
				TYPE_STRING = 9;
				TYPE_GROUP = 10;
				TYPE_MESSAGE = 11;
				TYPE_BYTES = 12;
