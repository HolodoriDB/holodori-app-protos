		message EnumValue {
			string name = 1;
			int32 number = 2;
			repeated Option options = 3;
		}

		message Option {
			string name = 1;
			Any value = 2;
		}

		message DoubleValue {
			double value = 1;
		}

		message FloatValue {
			float value = 1;
		}

		message Int64Value {
			int64 value = 1;
		}

		message UInt64Value {
			uint64 value = 1;
		}

		message Int32Value {
			int32 value = 1;
		}

		message UInt32Value {
			uint32 value = 1;
		}

		message BoolValue {
			bool value = 1;
		}

		message StringValue {
			string value = 1;
		}

		message BytesValue {
