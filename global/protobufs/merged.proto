			Field.Cardinality cardinality = 2;
			int32 number = 3;
			string name = 4;
			string type_url = 6;
			int32 oneof_index = 7;
			bool packed = 8;
			repeated Option options = 9;
			string json_name = 10;
			string default_value = 11;
		}

		message Enum {
			string name = 1;
			repeated EnumValue enumvalue = 2;
			repeated Option options = 3;
			SourceContext source_context = 4;
			Syntax syntax = 5;
			string edition = 6;
