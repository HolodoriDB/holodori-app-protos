      string country_code = 1;
    }

    message TutorialRegisterBirthdayRequest {
      int32 year = 1;
      int32 month = 2;
      int32 day = 3;
    }

    message TutorialSetNameRequest {
      string name = 1;
    }

    message TutorialRegisterInitialUserInfoRequest {
      string country_code = 1;
      int32 birth_year = 2;
      int32 birth_month = 3;
      string user_name = 4;
    }

    message TutorialChooseCharacterRequest {
      string character_id = 1;
    }

    message TutorialChooseCharacterResponse {
      repeated common.RewardResult reward_results = 1;
      common.Response common_response = 9999;
    }

    message TutorialDrawGachaResponse {
      repeated string card_ids = 1;
      string gacha_animation_grouping_id = 2;
      common.Response common_response = 9999;
    }

    message TutorialConfirmGachaResponse {
      repeated common.RewardResult card_reward_results = 1;
      common.Response common_response = 9999;
    }

    message TutorialListGachaCardResponse {
      repeated string card_ids = 1;
      common.Response common_response = 9999;
    }

    message TutorialReadInstantTipsRequest {
      string instant_tips_id = 1;
    }

    message TutorialProgressResponse {
      common.Response common_response = 9999;
    }

    message TutorialRegisterInitialUserInfoResponse {
      common.Response common_response = 9999;
    }

    message TutorialReadInstantTipsResponse {
      common.Response common_response = 9999;
    }

    service Tutorial {
      rpc Progress (TutorialProgressRequest) returns (TutorialProgressResponse);
      rpc RegisterInitialUserInfo (TutorialRegisterInitialUserInfoRequest) returns (TutorialRegisterInitialUserInfoResponse);
      rpc ChooseCharacter (TutorialChooseCharacterRequest) returns (TutorialChooseCharacterResponse);
      rpc DrawGacha (.google.protobuf.Empty) returns (TutorialDrawGachaResponse);
      rpc ConfirmGacha (.google.protobuf.Empty) returns (TutorialConfirmGachaResponse);
      rpc ListGachaCard (.google.protobuf.Empty) returns (TutorialListGachaCardResponse);
      rpc ReadInstantTips (TutorialReadInstantTipsRequest) returns (TutorialReadInstantTipsResponse);
    }

    message UserGetResponse {
      common.UserData user_data = 1;
    }

    message UserDeleteResponse {
      common.Response common_response = 9999;
    }

    service User {
      rpc Get (.google.protobuf.Empty) returns (UserGetResponse);
      rpc Delete (.google.protobuf.Empty) returns (UserDeleteResponse);
    }

    message UserContentCdnGetSignedCookieResponse {
      common.UserContentCdnSignedCookie signed_cookie = 1;
    }

    service UserContentCdn {
      rpc GetSignedCookie (.google.protobuf.Empty) returns (UserContentCdnGetSignedCookieResponse);
    }

    message WorkListWorkSlotPowerRequest {
      repeated WorkSlot slots = 1;
    }

    message WorkListWorkSlotPowerResponse {
      message WorkSlotPower {
        int32 slot_number = 1;
        int64 work_slot_power = 2;
      }
      repeated WorkListWorkSlotPowerResponse.WorkSlotPower work_slot_powers = 1;
      common.Response common_response = 9999;
    }

    message WorkStartRequest {
      repeated WorkSlot slots = 1;
    }

    message WorkSlot {
      int32 slot_number = 1;
      repeated string card_ids = 2;
    }

    message WorkFinishRequest {
      int32 slot_number = 1;
    }

    message WorkFinishResponse {
      WorkResult result = 1;
      common.Response common_response = 9999;
    }

    message WorkFinishAllResponse {
      repeated WorkResult results = 1;
      common.Response common_response = 9999;
    }

    message WorkCancelRequest {
      int32 slot_number = 1;
    }

    message WorkResult {
      int32 slot_number = 1;
      string work_id = 2;
      repeated common.RewardResult reward_results = 3;
      .enums.WorkEvaluationRankType evaluation_rank_type = 4;
      repeated common.RewardQuantityUp reward_ups_by_skill_tree = 5;
    }

    message WorkRefreshResponse {
      common.Response common_response = 9999;
    }

    message WorkStartResponse {
      common.Response common_response = 9999;
    }

    message WorkCancelResponse {
      common.Response common_response = 9999;
    }

    service Work {
      rpc ListWorkSlotPower (WorkListWorkSlotPowerRequest) returns (WorkListWorkSlotPowerResponse);
      rpc Refresh (.google.protobuf.Empty) returns (WorkRefreshResponse);
      rpc Start (WorkStartRequest) returns (WorkStartResponse);
      rpc Finish (WorkFinishRequest) returns (WorkFinishResponse);
      rpc FinishAll (.google.protobuf.Empty) returns (WorkFinishAllResponse);
      rpc Cancel (WorkCancelRequest) returns (WorkCancelResponse);
    }

  }

  message multi_game_server_manager {
    message MultiGameCircuitPickAreaResponse {
      message PickedArea {
        .enums.CircuitAreaType type = 1;
        int32 variation_number = 2;
      }
      MultiGameCircuitPickAreaResponse.PickedArea area1 = 1;
      MultiGameCircuitPickAreaResponse.PickedArea area2 = 2;
      MultiGameCircuitPickAreaResponse.PickedArea area3 = 3;
    }

    service MultiGameCircuit {
      rpc PickArea (.google.protobuf.Empty) returns (MultiGameCircuitPickAreaResponse);
    }

  }

}
