      string name = 4;
      string type_url = 6;
      int32 oneof_index = 7;
      bool packed = 8;
      repeated Option options = 9;
      string json_name = 10;
      string default_value = 11;
    }

    message Enum {
      string name = 1;
      repeated EnumValue enumvalue = 2;
      repeated Option options = 3;
      SourceContext source_context = 4;
      Syntax syntax = 5;
      string edition = 6;
    }

    message EnumValue {
      string name = 1;
      int32 number = 2;
      repeated Option options = 3;
    }

    message Option {
      string name = 1;
      Any value = 2;
    }

    message DoubleValue {
      double value = 1;
    }

    message FloatValue {
      float value = 1;
    }

    message Int64Value {
