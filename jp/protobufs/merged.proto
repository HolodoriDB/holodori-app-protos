message dto {
  message multi_game_result {
    message MultiGameCommonUserResult {
      message NpcInfo {
        string mini_game_npc_id = 1;
        string name_suffix = 2;
      }
      string public_user_id = 1;
      MultiGameCommonUserResult.NpcInfo npc_info = 2;
      string character_id = 3;
      string sd_costume_id = 4;
      string sd_costume_hair_accessory_id = 5;
      bool is_disconnected = 6;
    }

    message LiveCooperationResult {
      message UserResult {
        .enums.MusicDifficultyType music_difficulty_type = 1;
        .common.LiveBaseResult result = 2;
        int64 bonus_score = 3;
        int32 fever_point = 4;
        bool is_fever_succeeded = 5;
        MultiGameCommonUserResult common_user_result = 100;
      }
      string music_id = 1;
      repeated LiveCooperationResult.UserResult user_results = 2;
      bool is_fever_succeeded = 3;
      bool is_auto_play_allowed = 4;
    }

    message MiniGameCircuitResult {
      message RankResult {
        int32 rank = 1;
        int64 clear_time_milliseconds = 2;
        repeated MiniGameCircuitResult.AreaInfo area_infos = 3;
        repeated int64 area_pass_milliseconds = 50;
        repeated int32 dash_counts = 51;
        .enums.CheatSeverityType cheat_severity_type = 52;
        MultiGameCommonUserResult common_user_result = 100;
      }
      message AreaInfo {
        .enums.CircuitAreaType area_type = 1;
        int32 fall_count = 2;
        int32 crash_count = 3;
        int32 damage_count = 4;
      }
      repeated MiniGameCircuitResult.RankResult rank_results = 1;
    }

    message MiniGameComboCardGameResult {
      message RankResult {
        int32 rank = 1;
        int64 end_chip_quantity = 2;
        int64 start_bet_coin_quantity = 3;
        int32 ronned_count = 4;
        int32 mismatch_count = 5;
        repeated MiniGameComboCardGameResult.CompletionRole completion_roles = 6;
        MultiGameCommonUserResult common_user_result = 100;
      }
      message CompletionRole {
        .enums.ComboCardGameCardRoleType role_type = 1;
        string character_grouping_id = 2;
        string character_id = 3;
        bool is_same_category = 4;
      }
      repeated MiniGameComboCardGameResult.RankResult rank_results = 1;
      int32 deck_remaining_card_count = 2;
    }

    message MiniGameJumpRopeResult {
      message UserResult {
        int32 continuous_jump_count = 1;
        int32 success_jump_count = 2;
        int32 failure_jump_count = 3;
        int64 gimmick_random_seed = 50;
        MultiGameCommonUserResult common_user_result = 100;
      }
      int32 total_jump_count = 1;
      repeated MiniGameJumpRopeResult.UserResult user_results = 2;
    }

  }

}

