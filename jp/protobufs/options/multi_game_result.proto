syntax = "proto3";

import "enums/multi_game_type.gen.proto";
import "google/protobuf/descriptor.proto";

package options.multi_game_result;

option go_package = "github.com/qua-vision/vision-server/pkg/pb/options/multi_game_result";

extend google.protobuf.MessageOptions {
	MessageOption message = 50500;
}

message MessageOption {
	enum JsonFieldNameType {
		UNKNOWN = 0;
		GO_FIELD_NAME = 1;
	}

	.enums.MultiGameType multi_game_type = 1;
	MessageOption.JsonFieldNameType json_field_name_type = 2;
}
