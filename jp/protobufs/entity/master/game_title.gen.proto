syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";
import "enums/game_title_asset_type.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message GameTitle {
  string id = 1;
  enums.GameTitleAssetType asset_type = 2;
  string asset_id = 3;
  string bgm_asset_id = 4;
  string condition_group_id = 5;
  int32 priority = 6;
}
