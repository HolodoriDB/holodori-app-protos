syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";
import "enums/live_evaluation_rank_type.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message LiveScoreEvaluationRank {
  string group_id = 1;
  enums.LiveEvaluationRankType evaluation_rank_type = 2;
  int32 plus = 3;
  int64 score = 4;
}
