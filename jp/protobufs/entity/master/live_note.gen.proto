syntax = "proto3";

package entity.master;

import "entity/master/options/master.proto";
import "enums/live_note_judgement_type.gen.proto";
import "enums/live_note_type.gen.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/master";
option csharp_namespace = "Vision.Common.Proto.Master";

message LiveNote {
  enums.LiveNoteType note_type = 1;
  enums.LiveNoteJudgementType judgement_type = 2;
  float acceptable_before_frame_count = 3;
  float acceptable_after_frame_count = 4;
  int32 score_coefficient_permil_multiply = 5;
  int32 pc_score_coefficient_permil_multiply = 6;
  int32 life_reduction_quantity = 7;
  int32 fever_point = 8;
  int32 music_creative_chart_difficulty_weight_permil = 100;
}
