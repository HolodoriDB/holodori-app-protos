syntax = "proto3";

package common;

import "buf/validate/validate.proto";

option go_package = "github.com/qua-vision/vision-server/pkg/pb/common";
option csharp_namespace = "Vision.Common.Proto.Common";

message LiveBaseResult {
  int64 score = 1;
  int32 miss_count = 2;
  int32 bad_count = 3;
  int32 good_count = 4;
  int32 great_count = 5;
  int32 perfect_count = 6;
  int32 auto_count = 7;
  int32 max_combo_count = 8;
  int32 remaining_life = 9;
  int32 tap_count = 10;
  int32 damage_count = 11;
  bool is_all_skill_activated = 12;
  int32 perfect_plus_count = 13;
  int32 plain_miss_count = 100;
  int32 plain_bad_count = 101;
  int32 plain_good_count = 102;
  int32 plain_great_count = 103;
  int32 plain_perfect_count = 104;
  int32 plain_perfect_plus_count = 105;
}

message LiveMultiUserSelectedMusic {
  string user_id = 1;
  string music_id = 2;
}
